<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViaLogic | Cartography of Minds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@500;700;800&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../../shared/vd-nav-fix.js"></script>
    <script src="./daxini-renderer.js"></script>
    <style>
        :root {
            --dx-cyan: #00e5ff;
            --dx-saffron: #ff671f;
            --bg-deep: #050a14;
            --bg-card: rgba(10, 15, 25, 0.7);
            --border-glow: rgba(0, 229, 255, 0.2);
            --font-main: 'Outfit', sans-serif;
            --font-heading: 'Syne', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-deep);
            color: #e8feff;
            font-family: var(--font-main);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 229, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 103, 31, 0.05) 0%, transparent 40%);
            min-height: 100vh;
        }

        .header {
            padding: 60px 20px 40px;
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header h1 {
            font-family: var(--font-heading);
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, var(--dx-cyan), var(--dx-saffron));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        .header p {
            font-size: 1.1rem;
            color: #98dce7;
            max-width: 600px;
            margin: 15px auto 0;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 40px 0;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .search-container {
            position: relative;
            max-width: 400px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 12px 20px 12px 45px;
            color: white;
            font-family: var(--font-main);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--dx-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--dx-cyan);
            font-size: 1.2rem;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 10px 20px;
            color: #98dce7;
            cursor: pointer;
            font-family: var(--font-main);
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(0, 229, 255, 0.15);
            border-color: var(--dx-cyan);
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 100px;
        }

        /* Customize Daxini Card for this View */
        .daxini-card {
            cursor: pointer;
        }

        .daxini-card__bio {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-height: 4.5rem !important;
        }

        .era-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 103, 31, 0.15);
            color: var(--dx-saffron);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 103, 31, 0.3);
            text-transform: uppercase;
        }

        #stats {
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--dx-saffron);
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            font-size: 1.5rem;
            padding: 100px;
            color: var(--dx-cyan);
            font-family: var(--font-heading);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Floating Nav Background */
        .via-nav-bg {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(to top, var(--bg-deep), transparent);
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>VIALOGIC</h1>
        <p>A Sovereign Cartography of historical minds. Explore the lineages of mathematics, philosophy, and science through 100+ interactive identities.</p>
    </header>

    <div id="stats">SYNCHRONIZING POPULATION: <span id="count">0</span> / 100 ENTITIES</div>

    <div class="controls">
        <div class="search-container">
            <i class="ph ph-magnifying-glass search-icon"></i>
            <input type="text" class="search-input" id="search" placeholder="Search by name, era, or category...">
        </div>
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Mathematics">Mathematics</button>
        <button class="filter-btn" data-filter="Philosophy">Philosophy</button>
        <button class="filter-btn" data-filter="Modern">Modern</button>
        <button class="filter-btn" data-filter="Golden Age">Golden Age</button>
    </div>

    <div id="app-grid" class="grid">
        <div class="loading">CALIBRATING NEURAL MESH...</div>
    </div>

    <footer class="via-nav-bg"></footer>

    <script>
        let people = [];
        let currentFilter = 'all';
        let searchQuery = '';

        async function init() {
            try {
                const response = await fetch('./people-registry.json');
                const data = await response.json();
                people = data.people;
                document.getElementById('count').textContent = people.length;
                render();
            } catch (err) {
                console.error("Failed to load registry:", err);
                document.getElementById('app-grid').innerHTML = '<div class="loading">FATAL: REGISTRY_NOT_FOUND</div>';
            }
        }

        function render() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = '';

            const filtered = people.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                    p.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    p.era.toLowerCase().includes(searchQuery.toLowerCase());
                
                if (currentFilter === 'all') return matchesSearch;
                if (currentFilter === 'Mathematics') return matchesSearch && p.category.includes('Math');
                if (currentFilter === 'Philosophy') return matchesSearch && p.category.includes('Philosophy');
                return matchesSearch && p.era.includes(currentFilter);
            });

            filtered.forEach(person => {
                const card = DaxiniRenderer.renderCard({
                    name: person.name,
                    title: `${person.era} · ${person.category}`,
                    summary: person.summary || `Historical identity: ${person.name}. Press to explore legacy.`,
                    design_tokens: {
                        cyan: person.category.includes('Math') ? '#00e5ff' : '#a78bfa',
                        saffron: person.era === 'Modern' ? '#ff671f' : '#f59e0b'
                    }
                });

                // Add era tag
                const tag = document.createElement('div');
                tag.className = 'era-tag';
                tag.textContent = person.era;
                card.appendChild(tag);

                // Add click handler
                card.onclick = () => {
                    window.location.href = person.path;
                };

                grid.appendChild(card);
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="loading">NO MATCHES IN CURRENT SECTOR</div>';
            }
        }

        // Search logic
        document.getElementById('search').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });

        // Filter logic
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        init();
    </script>
</body>
</html>
