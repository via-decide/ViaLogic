<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ViaLogic | Knowledge Network</title><link rel="stylesheet" href="styles/main.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"><script src="https://d3js.org/d3.v7.min.js"></script></head><body><div id="intro-overlay" aria-modal="true" role="dialog"><div class="intro-slide is-active" data-index="0"><span class="intro-wordmark">ViaLogic</span></div><div class="intro-slide" data-index="1"><p class="intro-line">Every great idea<br>has a lineage.</p></div><div class="intro-slide" data-index="2"><p class="intro-line intro-line--large">Map it.</p></div><div class="intro-slide" data-index="3"><button class="intro-enter" id="intro-enter-btn">Enter</button></div><span class="intro-hint" id="intro-hint">tap anywhere</span></div><nav class="nav"><div class="nav__logo">ViaLogic</div><div class="nav__links" id="nav-links"></div></nav><main id="app-view" class="view"><div id="atlas-view" class="view-content" style="display:none"><div class="atlas-hud"><span>Sparks: <strong id="sparks-value">0</strong></span></div><div id="map-viewport" aria-label="Interactive thinker map"><div id="scenery-layer" aria-hidden="true"></div><div id="map-layer"><svg id="paths-layer" viewBox="0 0 5000 3600" preserveAspectRatio="none"></svg><section id="entities-layer" aria-live="polite"></section></div><output id="map-error"></output></div></div><div id="people-view" class="view-content" style="display:none"><div class="page-container"><h1 class="page-title">Thinkers</h1><div id="search-container"></div><div id="people-grid" class="people-grid"></div></div></div><div id="graph-view" class="view-content" style="display:none"><div class="graph-container" id="graph-canvas"></div></div><div id="profile-view" class="view-content" style="display:none"><div class="page-container" id="profile-content"></div></div></main><section id="entity-modal" class="modal" aria-hidden="true"><article class="modal__content" data-modal-content></article></section><script src="ui/router.js"></script><script src="ui/nav.js"></script><script src="ui/search.js"></script><script src="ui/people-profile.js"></script><script src="ui/graph-view.js"></script><script src="ui/navigation.js"></script><script src="ui/entity-renderer.js"></script><script src="ui/modal-system.js"></script><script src="ui/map-engine.js"></script><script>window.addEventListener('DOMContentLoaded',()=>{if(window.ViaLogicNav)ViaLogicNav.init();if(window.ViaLogicRouter)ViaLogicRouter.init();});</script><script>(function(){var overlay=document.getElementById('intro-overlay');var slides=overlay.querySelectorAll('.intro-slide');var hint=document.getElementById('intro-hint');var cur=0;var total=slides.length;var busy=false;function show(i){slides[cur].classList.remove('is-active');cur=i;slides[cur].classList.add('is-active');hint.classList.toggle('is-hidden',cur===total-1);}function advance(){if(busy)return;if(cur<total-1){busy=true;setTimeout(function(){busy=false;},350);show(cur+1);}};function dismiss(){overlay.classList.add('is-gone');setTimeout(function(){overlay.remove();},600);}overlay.addEventListener('click',function(e){if(e.target.id==='intro-enter-btn'){dismiss();}else{advance();}});document.getElementById('intro-enter-btn').addEventListener('click',dismiss);setTimeout(function(){hint.classList.add('is-visible');},900);})();</script></body></html>
